<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SalesTracker — Трекер сделок</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="header-left">
        <h1 class="logo">SalesTracker</h1>
      </div>
      <div class="header-center" id="headerFilters" style="display:none">
        <button class="filter-toggle-btn" id="filterToggleBtn" title="Фильтры">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
        </button>
        <div class="filters-dropdown" id="filtersDropdown">
          <select id="filterManager" class="filter-select">
            <option value="">Все менеджеры</option>
          </select>
          <select id="filterStatus" class="filter-select">
            <option value="">Все статусы</option>
          </select>
        </div>
      </div>
      <div class="header-right">
        <div class="notifications-bell" id="bellBtn" title="Уведомления">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          <span class="badge" id="notifBadge" style="display:none">0</span>
        </div>
        <div class="user-info">
          <select id="userSelect" class="filter-select">
            <option value="user1">Алексей (Менеджер)</option>
            <option value="user2">Мария (Менеджер)</option>
            <option value="user3">Дмитрий (Менеджер)</option>
            <option value="boss">Ирина (Руководитель)</option>
          </select>
        </div>
      </div>
    </header>

    <div class="toolbar" id="toolbar" style="display:none">
      <button class="btn btn-primary" id="addDealBtn">+ Новая сделка</button>
      <div class="toolbar-stats" id="toolbarStats"></div>
    </div>

    <main class="board" id="board"></main>

    <div class="notifications-panel" id="notifPanel" style="display:none">
      <div class="notif-header">
        <h3>Уведомления</h3>
        <button class="btn-close" id="closeNotifBtn">&times;</button>
      </div>
      <div class="notif-list" id="notifList"></div>
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay" style="display:none">
    <div class="modal" id="dealModal">
      <div class="modal-header">
        <h2 id="modalTitle">Новая сделка</h2>
        <button class="btn-close" id="closeModalBtn">&times;</button>
      </div>
      <form id="dealForm" class="modal-body">
        <input type="hidden" id="dealId">
        <div class="form-row">
          <div class="form-group">
            <label for="dealClient">Клиент *</label>
            <input type="text" id="dealClient" required placeholder="Название компании">
          </div>
          <div class="form-group">
            <label for="dealContact">Контактное лицо</label>
            <input type="text" id="dealContact" placeholder="Имя, должность">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="dealPhone">Телефон</label>
            <input type="tel" id="dealPhone" placeholder="+7 (999) 123-45-67">
          </div>
          <div class="form-group">
            <label for="dealEmail">Email</label>
            <input type="email" id="dealEmail" placeholder="email@company.ru">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="dealAmount">Сумма</label>
            <input type="number" id="dealAmount" min="0" step="100" placeholder="0">
          </div>
          <div class="form-group">
            <label for="dealCurrency">Валюта</label>
            <select id="dealCurrency">
              <option value="RUB">₽ RUB</option>
              <option value="USD">$ USD</option>
              <option value="EUR">€ EUR</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="dealCloseDate">Прогнозная дата закрытия</label>
            <input type="date" id="dealCloseDate">
          </div>
          <div class="form-group">
            <label for="dealNextDate">Дата следующего шага</label>
            <input type="date" id="dealNextDate">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="dealActivity">Тип активности</label>
            <select id="dealActivity">
              <option value="">— Не указано —</option>
              <option value="Звонок">Звонок</option>
              <option value="Встреча">Встреча</option>
              <option value="Письмо">Письмо</option>
              <option value="Коммерческое предложение">КП</option>
              <option value="Договор">Договор</option>
              <option value="Презентация">Презентация</option>
            </select>
          </div>
          <div class="form-group">
            <label for="dealManager">Ответственный</label>
            <select id="dealManager">
              <option value="user1">Алексей</option>
              <option value="user2">Мария</option>
              <option value="user3">Дмитрий</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label for="dealStatus">Этап</label>
          <select id="dealStatus">
            <option value="new">Новый контакт</option>
            <option value="meeting">Встреча назначена</option>
            <option value="quote">КП отправлено</option>
            <option value="negotiation">Переговоры/согласование</option>
            <option value="contract">Договор подписан</option>
            <option value="paid">Оплачено</option>
          </select>
        </div>
        <div class="form-group">
          <label>История комментариев</label>
          <div id="commentsList" class="comments-list"></div>
          <div class="comment-input-row">
            <input type="text" id="commentInput" placeholder="Добавить комментарий..." class="comment-input">
            <button type="button" class="btn btn-small" id="addCommentBtn">+</button>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-danger" id="deleteDealBtn" style="display:none">Удалить</button>
          <div class="modal-actions-right">
            <button type="button" class="btn btn-secondary" id="cancelModalBtn">Отмена</button>
            <button type="submit" class="btn btn-primary">Сохранить</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
